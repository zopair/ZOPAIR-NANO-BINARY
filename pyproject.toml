[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zopair-nano-binary"
version = "0.1.0"
description = "Sequence-preserving geometric models for nanoscale binary storage research"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Aly Hussein Zopair" }]
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
